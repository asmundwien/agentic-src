name: Build and publish collections

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this main branch or version tag to the configured artifact repository
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collections-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build every collection at locked revisions
        run: pnpm build
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Exercise the built collections with native Rulesync
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          mkdir -p "$consumer/home" "$consumer/config" "$consumer/cache" "$consumer/data" "$consumer/project"
          cd "$consumer/project"
          export HOME="$consumer/home" XDG_CONFIG_HOME="$consumer/config" XDG_CACHE_HOME="$consumer/cache" XDG_DATA_HOME="$consumer/data"
          "$GITHUB_WORKSPACE/node_modules/.bin/rulesync" generate \
            --input-roots "$GITHUB_WORKSPACE/dist/collections/base,$GITHUB_WORKSPACE/dist/collections/testing" \
            --targets omp,claudecode --features rules,skills
      - name: Package the complete snapshot with executable modes
        run: tar -C dist -czf "$RUNNER_TEMP/agentic.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentic-${{ github.sha }}
          path: ${{ runner.temp }}/agentic.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      vars.ARTIFACT_REPOSITORY != '' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate the separate publication target
        id: target
        shell: bash
        env:
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
        run: |
          if [[ ! "$ARTIFACT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'ARTIFACT_REPOSITORY must be owner/repository' >&2
            exit 1
          fi
          if [[ "${ARTIFACT_REPOSITORY,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo 'The source repository cannot also be the artifact repository' >&2
            exit 1
          fi
          printf 'owner=%s\nrepository=%s\n' "${ARTIFACT_REPOSITORY%/*}" "${ARTIFACT_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agentic-${{ github.sha }}
          path: ${{ runner.temp }}/download
      - name: Restore the verified snapshot
        run: mkdir -p dist && tar -xzf "$RUNNER_TEMP/download/agentic.tar.gz" -C dist
      - name: Create a target-scoped publication token
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.ARTIFACT_APP_ID }}
          private-key: ${{ secrets.ARTIFACT_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repository }}
          permission-contents: write
      - name: Publish the complete snapshot
        shell: bash
        env:
          ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
          ARTIFACT_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          args=(--repository "$ARTIFACT_REPOSITORY")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/publish.mjs "${args[@]}"
